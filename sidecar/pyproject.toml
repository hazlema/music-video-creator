[project]
name = "mv-sidecar"
version = "0.1.0"
description = "Local image models for the music video app (runs on your GPU)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.8",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "transformers>=4.57",
    "accelerate>=1.10",
    "safetensors",
    "pillow",
    "huggingface_hub",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
